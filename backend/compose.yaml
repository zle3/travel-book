# Little Travel Book home backend: one Dockge stack (api, bot, tiles, cloudflared).
# Only cloudflared reaches the internet, through the Cloudflare tunnel (public hostname
# api.travel.zachle.info -> http://api:8787, remote-managed in the Cloudflare dashboard).
# No ports are published on the host. Secrets live in .env (template: env.example). Never commit .env.
# Docs: docs/BACKEND.md

name: travel-backend

services:
  api:
    image: travel-api:0.1.0
    build:
      context: ./api
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATABASE_PATH: /data/live.sqlite
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      PROXY_SECRET: ${PROXY_SECRET:-}           # must match the Worker's X-Travel-Proxy secret; empty = /v1/live open (not recommended)
      SITE_ORIGIN: ${SITE_ORIGIN:-https://travel.zachle.info}
      TILES_UPSTREAM: http://tiles:8080
    volumes:
      - api_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # No depends_on tiles: live data must keep working when the tile server is down.
    networks: [backend]

  bot:
    image: travel-bot:0.1.0
    build:
      context: ./bot
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN in .env}
      DISCORD_PLANNER_CHANNEL_ID: ${DISCORD_PLANNER_CHANNEL_ID:?set DISCORD_PLANNER_CHANNEL_ID in .env}
      DISCORD_OWNER_ID: ${DISCORD_OWNER_ID:-}   # optional: only this user's posts and taps count
      API_BASE: http://api:8787
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}  # optional: empty = no AI parsing, posts wait for the planner run
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      CHECK_INTERVAL_MIN: ${CHECK_INTERVAL_MIN:-5}
      BOT_DB_PATH: /data/bot.sqlite
      HEARTBEAT_PATH: /data/heartbeat
    volumes:
      - bot_data:/data
    healthcheck:
      # The bot touches /data/heartbeat every 30 s once it is logged in to Discord.
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/data/heartbeat');process.exit(Date.now()-s.mtimeMs<120000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

  tiles:
    # Serves every *.pmtiles in /data as /{name}/{z}/{x}/{y}.mvt and /{name}.json (TileJSON). Internal only.
    image: protomaps/go-pmtiles:v1.31.2
    restart: unless-stopped
    command: ["serve", "/data", "--port=8080", "--public-url=https://api.travel.zachle.info/v1/tiles"]
    volumes:
      - ./tiles:/data:ro                        # basemap-v<date>.pmtiles lives here (as on the live host)
    # The image is a single static binary with no shell or HTTP client, so no in-container check is possible.
    # The api proxy answers 502 when this service is down; restart: unless-stopped brings it back.
    networks: [backend]

  cloudflared:
    image: cloudflare/cloudflared:2026.11.2
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "0.0.0.0:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

volumes:
  api_data:
  bot_data:

networks:
  backend:
