<!doctype html>
<html lang="en" data-mode="desk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Little Travel Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --font:'Nunito',ui-rounded,system-ui,sans-serif;
  --bg:#fbf9fd;--surface:#fff;--surface2:#f7f1f6;--ink:#3b2832;--ink2:#6c495b;--ink3:#84596f;--line:#efe6ee;
  --rose:#e11d48;--rose-on:#fff;--rose-soft:#ffe4e6;--rose-soft-ink:#9f1239;--lav:#ebe8f5;--lav-ink:#4f4f6e;
  --shadow:0 8px 24px rgba(89,48,70,.12),0 1px 3px rgba(89,48,70,.08);--scrim:rgba(59,40,50,.4);--ring:#fb7185;
  --glass:rgba(251,249,253,.86);--sel:#fecdd3;
  --ease:cubic-bezier(.32,.72,0,1);--pop:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#211820;--surface:#2e222b;--surface2:#382a34;--ink:#f7eef3;--ink2:#dccad4;--ink3:#bfa0b1;--line:#43323d;
  --rose:#fb7185;--rose-on:#3b0d1a;--rose-soft:#4b2430;--rose-soft-ink:#ffc9d2;--lav:#403a5a;--lav-ink:#d9d9ea;
  --shadow:0 8px 24px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);--scrim:rgba(10,5,9,.6);--glass:rgba(33,24,32,.86);--sel:#6c2a3c;--ring:#fda4af;}
  :root:not([data-theme=light]) [class*=" g-"],:root:not([data-theme=light]) [class^="g-"]{--tb:color-mix(in srgb,var(--gf) 30%,var(--surface));--tf:color-mix(in srgb,var(--gf) 45%,#fff)}}
:root[data-theme=dark]{--bg:#211820;--surface:#2e222b;--surface2:#382a34;--ink:#f7eef3;--ink2:#dccad4;--ink3:#bfa0b1;--line:#43323d;
  --rose:#fb7185;--rose-on:#3b0d1a;--rose-soft:#4b2430;--rose-soft-ink:#ffc9d2;--lav:#403a5a;--lav-ink:#d9d9ea;
  --shadow:0 8px 24px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);--scrim:rgba(10,5,9,.6);--glass:rgba(33,24,32,.86);--sel:#6c2a3c;--ring:#fda4af;}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body[data-mode=phone]{background:var(--surface2)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
h1,h2,h3,h4,p{margin:0}
::selection{background:var(--sel);color:var(--ink)}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:12px}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink3) 40%,transparent) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink3) 40%,transparent);border-radius:8px}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* group colours: --gf strong, tile tint derived */
.g-food{--gf:#e11d48}.g-sweets{--gf:#c0306f}.g-boba{--gf:#7c4dcc}.g-drinks{--gf:#9d3a8a}.g-shop{--gf:#b4507c}
.g-sights{--gf:#5f5f96}.g-parks{--gf:#4558b8}.g-fun{--gf:#cc5528}.g-stays{--gf:#85587a}.g-park{--gf:#66667f}.g-other{--gf:#7c7c8c}
[class*=" g-"],[class^="g-"]{--tb:color-mix(in srgb,var(--gf) 15%,var(--surface));--tf:var(--gf)}
:root[data-theme=dark] [class*=" g-"],:root[data-theme=dark] [class^="g-"]{--tb:color-mix(in srgb,var(--gf) 30%,var(--surface));--tf:color-mix(in srgb,var(--gf) 45%,#fff)}

/* app frame */
.app{position:relative;height:100dvh;overflow:hidden;background:var(--bg)}
body[data-mode=phone] .app{max-width:430px;margin:0 auto;box-shadow:0 0 0 1px var(--line)}
body[data-mode=desk] .app{display:flex}
.left{position:relative;display:flex;flex-direction:column;min-width:0}
body[data-mode=phone] .left{position:absolute;inset:0}
body[data-mode=desk] .left{width:560px;flex:none;border-right:1px solid var(--line);background:var(--bg);z-index:2}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding-bottom:132px;overscroll-behavior:contain}
body[data-mode=desk] .scroll{padding-bottom:40px}
.mapwrap{position:relative;background:var(--surface2)}
body[data-mode=phone] .mapwrap{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s .3s}
body[data-mode=phone] .app[data-view=map] .mapwrap{opacity:1;visibility:visible;transition:opacity .3s ease}
body[data-mode=desk] .mapwrap{flex:1}
#map{position:absolute;inset:0}
.maplibregl-canvas{outline:none}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}
body[data-mode=phone] .app[data-view=map] .scroll{visibility:hidden}

/* header */
.top{padding:max(14px,env(safe-area-inset-top)) 18px 4px;display:flex;align-items:center;gap:6px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:900;font-size:19px;letter-spacing:-.01em;color:var(--ink)}
.brand .i{width:22px;height:22px;color:var(--rose);fill:var(--rose)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:background .2s,transform .18s var(--pop)}
.ib:hover{background:var(--surface2)}.ib:active{transform:scale(.9)}
.ib .i{width:24px;height:24px}
.hello{padding:0 18px 12px;color:var(--ink2);font-weight:600;font-size:15px}
.sun{display:none}:root[data-theme=dark] .moon{display:none}:root[data-theme=dark] .sun{display:block}

/* tiles */
.tiles{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 10px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 18px}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:5px;scroll-snap-align:start}
.tile .tb{position:relative;width:62px;height:62px;border-radius:21px;background:var(--tb);color:var(--tf);display:grid;place-items:center;transition:transform .35s var(--pop),background .2s,color .2s,box-shadow .2s}
.tile .tb .i{width:34px;height:34px;stroke-width:2.1}
.tile .tl{font-size:13px;font-weight:800;color:var(--ink2);line-height:1.1;text-align:center;white-space:nowrap}
.tile:active .tb{transform:scale(1.06,.9);transition-duration:.08s}
.tile[aria-pressed=true] .tb{background:var(--gf);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--gf) 38%,transparent)}
.tile[aria-pressed=true] .tl{color:var(--ink)}
.tile .ck{position:absolute;right:-4px;top:-4px;width:22px;height:22px;border-radius:50%;background:var(--surface);color:var(--gf);display:grid;place-items:center;transform:scale(0);transition:transform .35s var(--pop);box-shadow:0 1px 4px rgba(59,40,50,.25)}
.tile[aria-pressed=true] .ck{transform:scale(1)}
.tile .ck .i{width:14px;height:14px;stroke-width:3.2}
.pillrow{display:flex;gap:8px;overflow-x:auto;padding:0 14px 2px;scrollbar-width:none}
.pillrow::-webkit-scrollbar{display:none}
.pillrow .tile{flex-direction:row;width:auto;gap:0;height:44px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:5px 14px 5px 5px;align-items:center}
.pillrow .tile .tb{width:34px;height:34px;border-radius:50%;margin-right:7px}
.pillrow .tile .tb .i{width:20px;height:20px}
.pillrow .tile .tl{font-size:14px;color:var(--ink)}
.pillrow .tile .ck{display:none}
.pillrow .tile[aria-pressed=true]{background:var(--gf)}.pillrow .tile[aria-pressed=true] .tl{color:#fff}
.pillrow .tile[aria-pressed=true] .tb{background:rgba(255,255,255,.24);box-shadow:none}

body[data-mode=desk] .tiles{gap:3px;padding:4px 12px 10px;scroll-padding:0 12px}
body[data-mode=desk] .tile{width:62px}
body[data-mode=desk] .tile .tb{width:58px;height:58px;border-radius:20px}
/* sticky bar */
.bar{position:sticky;top:0;z-index:6;display:flex;gap:8px;padding:6px 18px 10px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:44px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px 0 42px;font:inherit;font-weight:600;font-size:15px;color:var(--ink);outline:0;transition:border-color .2s,box-shadow .2s}
.search input::placeholder{color:var(--ink3);opacity:1}
.search input:focus{border-color:var(--rose);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 35%,transparent)}
.search .i{position:absolute;left:13px;top:10px;color:var(--ink3);pointer-events:none}
.pill{height:44px;border-radius:22px;display:inline-flex;align-items:center;gap:7px;padding:0 15px 0 12px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;font-size:15px;color:var(--ink);position:relative;transition:transform .18s var(--pop),background .2s}
.pill:active{transform:scale(.95)}
.pill .i{width:21px;height:21px}
.pill .n{min-width:20px;height:20px;border-radius:10px;background:var(--rose);color:var(--rose-on);font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 5px}
.feedhead{padding:6px 20px 8px;display:flex;align-items:center;gap:10px;min-height:44px}
.feedhead h2{font-size:17px;font-weight:900;flex:1}
.feedhead h2 span{color:var(--ink3);font-weight:700}
.link{color:var(--rose-soft-ink);font-weight:800;font-size:14px;height:44px;padding:0 6px;border-radius:12px}
:root[data-theme=dark] .link{color:var(--rose)}

/* sort */
.sortw{position:relative}
.sortb{height:44px;border-radius:22px;padding:0 13px 0 10px;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--ink2);background:var(--surface);border:1.5px solid var(--line)}
.sortb .i{width:19px;height:19px}
.sortm{position:absolute;right:0;top:48px;z-index:12;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:6px;min-width:210px;animation:rise .25s var(--ease)}
.sortm button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 14px;border-radius:14px;font-weight:800;font-size:15px;text-align:left}
.sortm button[aria-checked=true]{background:var(--rose-soft);color:var(--rose-soft-ink)}
.sortm button:hover{background:var(--surface2)}
/* cards */
.feed{padding:0 14px;display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:26px;padding:6px 6px 6px 8px;box-shadow:0 1px 2px rgba(89,48,70,.06),0 4px 14px rgba(89,48,70,.05);transition:transform .2s,background .2s;animation:rise .34s var(--ease) both;animation-delay:calc(var(--k,0)*28ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.card.sel,.card.hl{background:color-mix(in srgb,var(--rose-soft) 55%,var(--surface))}
.card .open{flex:1;min-width:0;display:flex;align-items:center;gap:13px;text-align:left;padding:8px 4px 8px 4px;border-radius:20px}
.gi{width:54px;height:54px;border-radius:19px;background:var(--tb);color:var(--tf);display:grid;place-items:center;flex:none}
.gi .i{width:32px;height:32px;stroke-width:2.1}
.tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.card h3{font-size:17px;font-weight:800;line-height:1.2;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .sub{font-size:14px;font-weight:600;color:var(--ink3);line-height:1.25}
.note{align-self:flex-start;background:var(--rose-soft);color:var(--rose-soft-ink);font-weight:800;font-size:14px;padding:4px 11px 5px;border-radius:15px 15px 15px 5px;margin-top:3px;max-width:100%}
.tag{display:inline-block;background:var(--lav);color:var(--lav-ink);border-radius:10px;font-size:12.5px;font-weight:800;padding:1px 8px;margin-left:4px;vertical-align:1px}

/* heart */
.heart{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);flex:none;transition:background .2s}
.heart:hover{background:var(--surface2)}
.heart .i{width:28px;height:28px;stroke-width:2.1;transition:fill .15s,stroke .15s,color .15s}
.heart[aria-pressed=true]{color:var(--rose)}.heart[aria-pressed=true] .i{fill:var(--rose);stroke:var(--rose)}
.bh{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5px 0 0 -5px;pointer-events:none;z-index:3}
.bh svg{width:100%;height:100%;fill:currentColor;stroke:none}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:34px 36px;color:var(--ink2)}
.empty svg{width:120px;height:120px;margin-bottom:4px}
.empty h3{font-size:18px;font-weight:900;color:var(--ink)}
.empty p{font-size:15px;font-weight:600;max-width:270px}

/* floating */
.float{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:8;transition:opacity .25s,transform .4s var(--ease)}
.float>*{pointer-events:auto}
body[data-mode=desk] .float{display:none}
.app[data-sheet] .float,.app[data-sheet] .peek{opacity:0;pointer-events:none;transform:translateY(14px)}
.app[data-sheet] .float>*{pointer-events:none}
.mapbtn{height:52px;padding:0 24px 0 18px;border-radius:26px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px;box-shadow:var(--shadow);transition:transform .2s var(--pop)}
:root[data-theme=dark] .mapbtn{background:var(--surface2);color:var(--ink)}
.mapbtn:active{transform:scale(.94)}
.mapbtn .i{width:24px;height:24px}
.fab{position:absolute;right:16px;bottom:-2px;width:58px;height:58px;border-radius:50%;background:var(--rose);color:var(--rose-on);display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--rose) 45%,transparent),0 2px 4px rgba(0,0,0,.12);transition:transform .2s var(--pop)}
.fab:active{transform:scale(.92)}
.fab .i{width:30px;height:30px;fill:currentColor;stroke:currentColor}
.badge{position:absolute;right:-3px;top:-3px;min-width:24px;height:24px;border-radius:12px;background:var(--surface);color:var(--rose-soft-ink);font-weight:900;font-size:14px;display:grid;place-items:center;overflow:hidden;padding:0 6px;box-shadow:0 1px 4px rgba(59,40,50,.3);transform:scale(0);transition:transform .35s var(--pop)}
:root[data-theme=dark] .badge{color:#be123c}
.badge.on{transform:scale(1)}
.badge span{display:block;position:absolute;inset:0;display:grid;place-items:center}
body[data-mode=desk] .deskpicks{position:absolute;right:18px;top:18px;z-index:5;display:flex;gap:8px}
body[data-mode=phone] .deskpicks{display:none}
.dpick{height:50px;border-radius:25px;padding:0 20px 0 16px;background:var(--rose);color:var(--rose-on);font-weight:900;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px color-mix(in srgb,var(--rose) 40%,transparent);position:relative}
.dpick .i{fill:currentColor;stroke:currentColor;width:24px;height:24px}
.dpick .badge{position:static;transform:none;margin-left:2px;min-width:24px}
.dpick .badge span{position:static;display:inline}
.keychip{height:44px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);padding:0 16px 0 12px;display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px}
.keychip .i{width:22px;height:22px}

/* map overlay (phone) */
.maptop{position:absolute;left:0;right:0;top:0;z-index:5;padding:max(10px,env(safe-area-inset-top)) 0 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.maptop>*{pointer-events:auto}
.maptop .r1{display:flex;gap:8px;padding:0 14px;align-items:center}
.maptop .r1 .pill,.maptop .r1 .ib,.maptop .keychip{box-shadow:var(--shadow)}
.maptop .r1 .ib{background:var(--surface)}
.maptop .sp{flex:1;pointer-events:none}
.areachip{align-self:flex-start;margin-left:14px;height:32px;border-radius:16px;background:var(--glass);backdrop-filter:blur(10px);padding:0 13px;display:flex;align-items:center;font-weight:800;font-size:13.5px;color:var(--ink2);box-shadow:var(--shadow)}
body[data-mode=desk] .maptop{left:auto;right:auto;top:18px;left:18px}
body[data-mode=desk] .maptop .r1{padding:0}
body[data-mode=desk] .maptop .pillrow,body[data-mode=desk] .maptop .r1 .pill,body[data-mode=desk] .maptop .r1 .ib{display:none}
body[data-mode=phone] .maptop{display:none}
body[data-mode=phone] .app[data-view=map] .maptop{display:flex}
body[data-mode=desk] .maptop .areachip{margin:0}

/* peek */
.peek{position:absolute;left:0;right:0;bottom:92px;z-index:7;transition:opacity .25s,transform .4s var(--ease)}
.peek[hidden]{display:none}
body[data-mode=phone] .app:not([data-view=map]) .peek{display:none}
body[data-mode=desk] .peek{left:20px;right:auto;bottom:22px;width:440px}
.ptrack{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 30px 12px;scrollbar-width:none;overscroll-behavior-x:contain}
.ptrack::-webkit-scrollbar{display:none}
body[data-mode=desk] .ptrack{padding:6px 0 12px;scroll-snap-type:x mandatory}
.pc{flex:none;width:calc(100% - 0px);max-width:330px;width:330px;scroll-snap-align:center;background:var(--surface);border-radius:28px;padding:10px 6px 10px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:4px;animation:rise .35s var(--ease) both}
body[data-mode=desk] .pc{width:440px;max-width:none}
.pc .open{flex:1;min-width:0;display:flex;gap:13px;align-items:center;text-align:left;border-radius:20px}
.pc .gi{width:56px;height:56px}
.pc h3{font-size:17px;font-weight:800;line-height:1.2}
.pc .sub{font-size:14px;font-weight:700;color:var(--ink3)}
.dots{display:flex;gap:5px;justify-content:center;margin-top:-4px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--ink3);opacity:.35;transition:all .25s var(--ease)}
.dots i.on{width:16px;opacity:1;background:var(--rose)}

/* sheets */
#scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.app[data-sheet] #scrim{opacity:1;pointer-events:auto}
.app[data-sheet=detail][data-view=map] #scrim{opacity:0;pointer-events:none}
body[data-mode=desk] .app[data-sheet=filters] #scrim{width:560px;right:auto}
body[data-mode=desk] .app[data-sheet=picks] #scrim,body[data-mode=desk] .app[data-sheet=shows] #scrim,body[data-mode=desk] .app[data-sheet=key] #scrim{background:transparent}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;z-index:30;background:var(--surface);border-radius:30px 30px 0 0;display:flex;flex-direction:column;transform:translateY(106%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;box-shadow:0 -10px 40px rgba(59,40,50,.18)}
.sheet.open{transform:none;visibility:visible;transition:transform .45s var(--ease)}
.sheet.tall{height:90%}
.grab{flex:none;touch-action:none;cursor:grab}
.grab>i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 4px;filter:brightness(.92)}
.sh-head{display:flex;align-items:center;gap:6px;padding:4px 10px 8px 22px}
.sh-head h2{font-size:22px;font-weight:900;flex:1;letter-spacing:-.01em}
.sh-body{flex:1;overflow-y:auto;padding:4px 20px 20px;overscroll-behavior:contain}
.sh-foot{flex:none;padding:12px 18px max(18px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px}
.cta{flex:1;height:54px;border-radius:27px;background:var(--rose);color:var(--rose-on);font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .18s var(--pop)}
.cta:active{transform:scale(.97)}
.cta .i{width:22px;height:22px}
.cta.sec{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line)}
.cta[disabled]{opacity:.55}
body[data-mode=desk] .grab{display:none}
body[data-mode=desk] #sh-filters{right:auto;width:560px}
body[data-mode=desk] #sh-detail{display:none}
body[data-mode=desk] #sh-picks,body[data-mode=desk] #pg-shows,body[data-mode=desk] #sh-key{left:auto;right:12px;top:12px;bottom:12px;width:430px;max-height:none;border-radius:28px;transform:translateX(112%)}
body[data-mode=desk] #sh-picks.open,body[data-mode=desk] #pg-shows.open,body[data-mode=desk] #sh-key.open{transform:none}
body[data-mode=desk] #sh-key{height:auto;top:auto;bottom:12px;max-height:80%}
.h3{font-size:16px;font-weight:900;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.h3:first-child{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;border-radius:22px;padding:0 16px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:8px;transition:transform .18s var(--pop),background .2s,border-color .2s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--rose-soft);border-color:var(--rose);color:var(--rose-soft-ink)}
:root[data-theme=dark] .chip[aria-pressed=true]{color:var(--rose-soft-ink)}
.chip .c{color:var(--ink3);font-weight:700;font-size:13.5px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lc{min-height:52px;border-radius:18px;padding:5px 12px 5px 6px;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:9px;text-align:left;font-weight:800;font-size:14.5px;line-height:1.15;transition:transform .18s var(--pop),background .2s,border-color .2s}
.lc:active{transform:scale(.96)}
.lc .gi{width:38px;height:38px;border-radius:14px}.lc .gi .i{width:23px;height:23px}
.lc .c{margin-left:auto;color:var(--ink3);font-size:13px;font-weight:700;padding-left:4px}
.lc[aria-pressed=true]{background:color-mix(in srgb,var(--gf) 12%,var(--surface));border-color:var(--gf)}
.lc[aria-pressed=true] .gi{background:var(--gf);color:#fff}
.hd{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;margin:20px 0 9px;color:var(--ink2)}
.sw{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;text-align:left;font-weight:800;font-size:16px}
.sw .t{flex:1}
.sw .k{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;transition:background .25s;filter:brightness(.94)}
.sw .k::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .35s var(--pop)}
.sw[aria-pressed=true] .k{background:var(--rose);filter:none}.sw[aria-pressed=true] .k::after{transform:translateX(20px)}
.seg{display:flex;gap:8px}
.seg .chip{flex:1;justify-content:center;min-height:50px;font-size:16px}

/* detail */
.dt-top{display:flex;gap:14px;align-items:center;padding:6px 6px 0}
.dt-top .gi{width:68px;height:68px;border-radius:24px}.dt-top .gi .i{width:40px;height:40px}
.dt-top h2{font-size:24px;font-weight:900;line-height:1.15;letter-spacing:-.01em}
.dt-top .sub{font-size:15px;font-weight:700;color:var(--ink3);margin-top:3px}
.dt-note{margin:18px 6px 0;background:var(--rose-soft);color:var(--rose-soft-ink);border-radius:22px 22px 22px 6px;padding:12px 16px}
.dt-note small{display:block;font-size:13px;font-weight:700;opacity:.85}
.dt-note b{font-size:20px;font-weight:900}
.dt-row{display:flex;gap:10px;align-items:flex-start;margin:16px 6px 0;color:var(--ink2);font-weight:600;font-size:15px}
.dt-row .i{width:22px;height:22px;color:var(--ink3);margin-top:1px}
.dt-row a{color:var(--rose-soft-ink);font-weight:800}
:root[data-theme=dark] .dt-row a{color:var(--rose)}
.hbig{flex:1;height:54px;border-radius:27px;border:2px solid var(--rose);color:var(--rose-soft-ink);font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;gap:9px;position:relative;transition:background .2s,color .2s,transform .18s var(--pop)}
:root[data-theme=dark] .hbig{color:var(--rose)}
.hbig .i{width:26px;height:26px}
.hbig[aria-pressed=true]{background:var(--rose);color:var(--rose-on)}
:root[data-theme=dark] .hbig[aria-pressed=true]{color:var(--rose-on)}
.hbig[aria-pressed=true] .i{fill:currentColor}
.hbig:active{transform:scale(.97)}

/* picks */
.prow{display:flex;align-items:center;gap:12px;padding:8px 0}
.prow .gi{width:48px;height:48px;border-radius:17px}.prow .gi .i{width:28px;height:28px}
.prow .tx{flex:1;min-width:0}.prow h3{font-size:16.5px;font-weight:800;line-height:1.2}.prow .sub{font-size:14px;font-weight:600;color:var(--ink3)}

/* shows */
.page{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateX(104%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s}
.page.open{transform:none;visibility:visible;transition:transform .45s var(--ease)}
.pg-head{display:flex;align-items:center;gap:6px;padding:max(12px,env(safe-area-inset-top)) 12px 6px 8px}
.pg-head h2{font-size:24px;font-weight:900;letter-spacing:-.01em}
.pg-sub{padding:0 20px 10px;color:var(--ink3);font-weight:700;font-size:14px}
.pg-body{flex:1;overflow-y:auto;padding:0 14px 30px}
.day{font-size:15px;font-weight:900;color:var(--ink2);margin:14px 6px 8px;display:flex;align-items:center;gap:8px}
.show{background:var(--surface);border-radius:24px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(89,48,70,.06),0 4px 14px rgba(89,48,70,.05)}
.show .tm{font-size:13.5px;font-weight:800;color:var(--rose-soft-ink);background:var(--rose-soft);display:inline-block;border-radius:12px 12px 12px 4px;padding:2px 10px;margin-bottom:6px}
.show h3{font-size:17px;font-weight:800;line-height:1.25}
.show .v{font-size:14.5px;font-weight:700;color:var(--ink2);margin-top:3px}
.show .gs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.show .gs span{background:var(--lav);color:var(--lav-ink);border-radius:12px;font-size:13px;font-weight:800;padding:2px 10px}
.show .gs em{font-style:normal;font-size:13.5px;font-weight:700;color:var(--ink3);margin-left:auto}
.credit{font-size:13px;color:var(--ink3);font-weight:700;padding:8px 8px 0;text-align:center}
body[data-mode=desk] .page{left:auto;right:12px;top:12px;bottom:12px;width:430px;inset:12px 12px 12px auto;border-radius:28px;box-shadow:var(--shadow);transform:translateX(112%);overflow:hidden}
body[data-mode=desk] .page.open{transform:none}

/* key */
.kg{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.kr{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14.5px;line-height:1.15;min-height:44px}
.pin{width:30px;height:30px;border-radius:50%;background:var(--gf);color:#fff;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(59,40,50,.3);flex:none}
.pin .i{width:17px;height:17px;stroke-width:2.4}
.pin.big{width:64px;height:64px;border-width:3px}.pin.big .i{width:36px;height:36px;stroke-width:2.2}

/* toast, tip */
#toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);font-weight:800;font-size:15px;padding:12px 20px;border-radius:24px;opacity:0;pointer-events:none;transition:all .35s var(--ease);z-index:60;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#tip{position:absolute;z-index:9;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 12px;font-weight:800;font-size:14px;transform:translate(-50%,-135%);opacity:0;transition:opacity .15s;white-space:nowrap}
#tip small{display:block;font-weight:700;opacity:.8;font-size:12.5px}
.credit-map{position:absolute;right:8px;bottom:4px;font-size:12px;font-weight:700;color:var(--ink2);background:var(--glass);border-radius:8px;padding:1px 7px;z-index:2;pointer-events:none}
body[data-mode=phone] .credit-map{bottom:auto;top:auto;left:8px;right:auto;bottom:8px;display:none}
body[data-mode=phone] .app[data-view=map] .credit-map{display:block}
.app[data-sheet] .credit-map{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  let best=L[0],bn=-1;L.forEach(p=>{let k=0;for(const q of L)if(Math.abs(q.lat-p.lat)<.3&&Math.abs(q.lng-p.lng)<.3)k++;if(k>bn){bn=k;best=p}});
  const core=L.filter(p=>Math.abs(p.lat-best.lat)<.3&&Math.abs(p.lng-best.lng)<.3);const bb=new maplibregl.LngLatBounds();(core.length?core:L).forEach(p=>bb.extend([p.lng,p.lat]));
  MAP.fitBounds(bb,{padding:DESK?{top:80,bottom:80,left:60,right:90}:{top:150,bottom:130,left:40,right:40},maxZoom:14,duration:700})}
function fadeIn(){
  if(!MAP||RM.matches)return;
  const run=()=>{if(!MAP.getLayer('pins-dot'))return;MAP.setPaintProperty('pins-dot','circle-opacity',0);MAP.setPaintProperty('pins-dot','circle-stroke-opacity',0);MAP.setPaintProperty('pins-icon','icon-opacity',0);MAP.setPaintProperty('pins-icon','text-opacity',0);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{MAP.setPaintProperty('pins-dot','circle-opacity',1);MAP.setPaintProperty('pins-dot','circle-stroke-opacity',1);MAP.setPaintProperty('pins-icon','icon-opacity',1);MAP.setPaintProperty('pins-icon','text-opacity',1)}))};
  if(MAPREADY)run();else MAP.once('load',run)}

/* ---------- state changes ---------- */
function filtersChanged(){
  S.bounds=null;renderTiles();renderList();refreshPins();
  if(S.sheet==='filters')syncFilterSheet();
  if(S.sel!=null&&!pass(BY[S.sel],true))closePeek();
  if(MAP&&(DESK||S.view==='map'))fitFiltered()}
async function setView(v){
  S.view=v;app.dataset.view=v;const b=$('#viewbtn');
  b.innerHTML=`<svg class="i"><use href="#u-${v==='map'?'list':'map'}"/></svg><span>${v==='map'?'List':'Map'}</span>`;
  if(v==='map'){await ensureMap();MAP.resize();fadeIn()}else{closePeek();$('#scroll').scrollTop=0}}

function sortMenu(){const m=$('#sortm');m.innerHTML=SORTS.map(([k,l])=>`<button role="menuitemradio" aria-checked="${S.sort===k}" data-sort="${k}">${l}</button>`).join('')}
document.addEventListener('click',e=>{
  const so=e.target.closest('[data-sort]');
  if(so){S.sort=so.dataset.sort;$('#sortb span').textContent=SORTS.find(x=>x[0]===S.sort)[1].replace(' to map centre','').replace('Nearest','Nearby');$('#sortb').setAttribute('aria-label','Sort: '+SORTS.find(x=>x[0]===S.sort)[1]);$('#sortm').hidden=true;$('#sortb').setAttribute('aria-expanded','false');renderList();$('#scroll').scrollTo({top:0});return}
  if(e.target.closest('#sortb')){const m=$('#sortm');sortMenu();m.hidden=!m.hidden;$('#sortb').setAttribute('aria-expanded',!m.hidden);return}
  if(!e.target.closest('#sortm')){const m=$('#sortm');if(m&&!m.hidden){m.hidden=true;$('#sortb').setAttribute('aria-expanded','false')}}
  const t=e.target.closest('button,[data-act],a');if(!t)return;
  const act=t.dataset.act;
  const ht=e.target.closest('[data-heart]');if(ht){toggleHeart(+ht.dataset.heart,ht);return}
  const hb=e.target.closest('[data-hbig]');if(hb){toggleHeart(+hb.dataset.hbig,hb);return}
  const tile=e.target.closest('[data-tile]');if(tile){toggleTile(tile.dataset.tile);return}
  const open=e.target.closest('.open');
  if(open){const el=open.closest('[data-id]');const id=+el.dataset.id;
    if(el.classList.contains('pc')){renderDetail(id);openSheet('detail','.hbig');return}
    if(DESK){if(!MAPREADY&&!MAP)return;if(!MAP.loaded()){}openPeek(id,true);return}
    if(S.view==='map'){openPeek(id,true);return}
    renderDetail(id);openSheet('detail','.hbig');markPhoneSel(id);return}
  if(t.dataset.cat){const id=t.dataset.cat;S.cats.has(id)?S.cats.delete(id):S.cats.add(id);filtersChanged();return}
  if(t.dataset.src){if(t.dataset.src==='m'){S.mine=!S.mine}else{S.others.size?S.others.clear():OL.forEach(l=>S.others.add(l.id))}filtersChanged();return}
  if(t.dataset.ol){const id=t.dataset.ol;S.others.has(id)?S.others.delete(id):S.others.add(id);filtersChanged();return}
  if(t.dataset.region!==undefined&&t.closest('#sh-filters')){S.region=t.dataset.region;filtersChanged();return}
  if(t.hasAttribute('data-been')){S.hideBeen=!S.hideBeen;filtersChanged();return}
  if(t.id==='fclear'){S.bounds=null;renderList();fitFiltered();return}
  switch(act){
    case'theme':{const n=resolved()==='dark'?'light':'dark';setTheme(n,true);break}
    case'view':setView(S.view==='map'?'list':'map');break;
    case'filters':syncFilterSheet();openSheet('filters','.cta');break;
    case'key':renderKey();openSheet('key');break;
    case'picks':renderPicks();openSheet('picks');break;
    case'shows':openSheet('shows');break;
    case'close':closeSheet();break;
    case'reset':S.mine=true;S.others.clear();S.cats.clear();S.region='';S.hideBeen=false;S.q='';$('#q').value='';filtersChanged();break;
    case'send':send();break;
    case'copy':copyText(picksText()).then(ok=>toast(ok?'Copied. Paste it anywhere':'Could not copy'));break}
});
function markPhoneSel(id){S.sel=id;$$('.card.sel').forEach(c=>c.classList.remove('sel'));const c=$(`.card[data-id="${id}"]`);c&&c.classList.add('sel')}
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim();S.bounds=null;renderList();refreshPins()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
['#sh-filters','#sh-detail','#sh-picks','#sh-key'].forEach(s=>dragSheet($(s)));

/* ---------- boot ---------- */
renderTiles();renderList();renderPicks();renderKey();renderShows();
const hp=H.get('p');if(hp){hp.split('|').forEach(n=>{const p=byName(n);if(p&&!S.picks.includes(p.id))S.picks.push(p.id)});lastN=S.picks.length;$$('[data-count]').forEach(b=>{$('span',b).textContent=S.picks.length});updateCount(false);$$('[data-heart]').forEach(b=>b.setAttribute('aria-pressed',S.picks.includes(+b.dataset.heart)));renderPicks()}
if(H.get('o')){OL.forEach(l=>S.others.add(l.id))}
if(H.get('c')){H.get('c').split(',').forEach(g=>catsOfGroup(g).forEach(c=>S.cats.add(c)))}
if(H.get('o')||H.get('c')){renderTiles();renderList()}
$$('[data-count]').forEach(b=>b.classList.toggle('on',S.picks.length>0||!!b.closest('.deskpicks')));
(async()=>{
  if(DESK){await ensureMap();MAP.resize();fadeIn()}else if(H.get('v')==='map'){await setView('map')}
  const sp=H.get('s'),d=H.get('d');
  if(H.get('sel')){const p=byName(H.get('sel'));if(p){openPeek(p.id,true)}}
  if(sp==='filters'){syncFilterSheet();openSheet('filters','.cta')}
  else if(sp==='detail'&&d){const p=byName(d);renderDetail(p.id);openSheet('detail','.hbig')}
  else if(sp==='picks'){renderPicks();openSheet('picks')}
  else if(sp==='shows')openSheet('shows');
  else if(sp==='key'){openSheet('key')}
})();
window.TB={S,setView,openSheet,toggleHeart};
</script>
</body>
</html>
