*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

</style></head><body><div id="dk">

function openPeek(id,noFly){const p=BY[id];sel=id;peekIds=[id,...nearest(id,10).map(q=>q.i).filter(x=>x!==id)];
 const pk=$('#peek');pk.innerHTML=peekIds.map(i=>peekCard(BY[i])).join('');syncHearts(pk);pk.hidden=false;pk.scrollLeft=0;M.setSel(p.has?id:null);markRow(id);if(p.has&&!noFly)M.fly(p,14)}

function renderActive(){const a=[];F.cats.forEach(id=>{const c=CAT[id];a.push(`<button class="chip rm" style="--gc:${c.g.color}" data-rm="cat:${id}" aria-label="Remove filter ${esc(c.name)}">${ic(id,19)}${esc(c.name)}<span class="x">${ic('close',13)}</span></button>`)});
 F.ol.forEach(n=>a.push(rm('ol:'+n,n)));if(F.region!=='all')a.push(rm('region',F.region));if(F.hideBeen)a.push(rm('been',"Hiding places I've been"));if(F.area)a.push(rm('area','Map area'));if(F.q)a.push(rm('q','“'+F.q+'”'));$('#active').innerHTML=a.join('')}
$('#active').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;const [k,v]=b.dataset.rm.split(':');
 if(k==='cat')F.cats.delete(v);else if(k==='ol')F.ol.delete(b.dataset.rm.slice(3));else if(k==='region')F.region='all';else if(k==='been')F.hideBeen=false;else if(k==='area'){F.area=null;renderAll(false);return}else if(k==='q'){F.q='';$('#q').value='';$('#qclr').hidden=true}filtersChanged()});

function drawSide(){const cn={};P.forEach(p=>{if(p.s===F.src)cn[p.c]=(cn[p.c]||0)+1});const regs=['all','Bay Area','Sacramento','Seattle','New York'];let h='';

 h+=`<button class="trow" role="switch" aria-checked="${F.hideBeen}" data-fb><span>Hide places I've been</span><span class="switch"></span></button>`;

 else if(b=t.closest('[data-fo]')){const n=b.dataset.fo;if(F.src!=='o'){F.src='o';F.cats.clear();$$('.seg [data-src]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.src==='o'))}F.ol.has(n)?F.ol.delete(n):F.ol.add(n)}
