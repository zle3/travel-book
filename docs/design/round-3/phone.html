<style>/* tokens.css */
/* Little Travel Book, design tokens (round 3, build-ready).
   Theme rules:
   - The app sets <html data-theme="dark|light"> in an inline head script: stored choice (localStorage "tb-theme") else "dark" (zachle.info default).
   - The prefers-color-scheme block below only applies when NO data-theme is set (JS off), so it never fights the stored choice.
   - Names match DESIGN.md where they exist; --control, --cta-*, --cat-*, --map-* are new. */
:root {
  /* colour: light (lavender-white ground, plum ink) */
  --bg: #f6f5fb; --surface: #ffffff; --surface-2: #f1eff7;
  --ink: #3b2832; --ink-2: #6c495b; --muted: #7f5a6e; --line: #e8e4ef;
  --accent: #e11d48; --accent-ink: #ffffff; --accent-soft: #ffe4e6; --accent-soft-ink: #be123c; /* rose-600 + white = 4.7:1 */
  --control: #6c495b; --control-ink: #ffffff;           /* selected chips, toggles, segmented controls (mauve-700) */
  --heart: #f43f5e;                                     /* graphic only, never text */
  --focus: #9b6b84; --sel: #e7d9e1; --scrim: rgba(45,30,40,.38);
  --warn-bg: #fff4d6; --warn-ink: #6b4a00;
  --been: #2f7d6b; --been-ink: #ffffff;                 /* been check badge, 4.9:1 */
  --new-bg: #e3e8f4; --new-ink: #34457a;                /* "New / Added" owner-content badge */
  --pick-bg: #ffe4e6; --pick-ink: #9f1239;              /* "Zach's pick" */
  /* category groups: disc colours carry a white glyph at >= 4.3:1 in BOTH themes (same discs on satellite) */
  --cat-food: #e11d48;      --cat-drinks: #6d5fc0;  --cat-shop: #8a5a76;   --cat-sights: #55689a;
  --cat-outdoors: #3f8070;  --cat-activities: #92357c; --cat-stay: #6b6b85; --cat-other: #6f6c7c;
  --cat-ring: #ffffff;
  --michelin: #b45309; --michelin-soft: #fdf0dc; --michelin-ink: #8a3f06; /* Michelin layer + distinctions: amber, own rosette icon, never Michelin logos */
  /* soft tints behind icons in lists (bg / glyph) */
  --tint-food: #ffe4e6;      --tint-food-ink: #be123c;
  --tint-drinks: #ebe8fa;    --tint-drinks-ink: #5a4bb0;
  --tint-shop: #f3e6ee;      --tint-shop-ink: #84596f;
  --tint-sights: #e3e8f4;    --tint-sights-ink: #43568a;
  --tint-outdoors: #ddf0ea;  --tint-outdoors-ink: #2f6f60;
  --tint-activities: #f4e3ee;--tint-activities-ink: #7a2f60;
  --tint-stay: #e8e8ef;      --tint-stay-ink: #55557a;
  --tint-other: #ebeaee;     --tint-other-ink: #5b5867;
  /* map (standard style restyle values, consumed by map-config.js) */
  --map-bg: #f1effa; --map-water: #d5daf3; --map-park: #e6e9f4; --map-road: #ffffff; --map-casing: #e0dbee;
  --map-building: #e8e4f2; --map-label: #6f5f80; --map-halo: #ffffff;
  --map-pin-halo: rgba(59,40,50,.22); --map-sel: #6c495b; --map-user: #2f6fd6;
  /* type */
  --font-sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fs-xs: .75rem; --fs-sm: .8125rem; --fs-md: .9375rem; --fs-base: 1rem; --fs-lg: 1.25rem; --fs-xl: 1.5rem; --fs-2xl: 2rem; --lh-body: 1.4;
  --fw-regular: 500; --fw-medium: 600; --fw-bold: 700;
  /* space (4px base), radius, touch */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-7: 32px;
  --radius-sm: 12px; --radius: 18px; --radius-lg: 26px; --radius-pill: 999px; --tap: 44px;
  /* depth */
  --shadow-sm: 0 1px 2px rgba(59,40,50,.08), 0 2px 8px rgba(59,40,50,.08);
  --shadow: 0 1px 2px rgba(59,40,50,.08), 0 6px 20px rgba(59,40,50,.10);
  --shadow-up: 0 -2px 24px rgba(59,40,50,.14);
  /* motion (all collapse to 0 under prefers-reduced-motion, see bottom) */
  --ease: cubic-bezier(.2,.9,.25,1);        /* sheets, fly-to: decelerate, no overshoot */
  --ease-pop: cubic-bezier(.3,1.5,.5,1);    /* heart pop, toggle thumb: tiny overshoot */
  --ease-out: cubic-bezier(.2,.8,.3,1);
  --t-fast: 120ms; --t-base: 260ms; --t-sheet: 440ms; --t-pop: 360ms; --t-fly: 600ms;
  /* layout */
  --wrap: 1200px; --panel-w: 408px; --header-h: 64px;
}
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }

/* dark values, declared once as a block and applied two ways */
:root[data-theme="dark"] {
  --bg: #1e1520; --surface: #2b1e29; --surface-2: #382836;
  --ink: #f6ecf2; --ink-2: #dbc8d3; --muted: #c4a6b8; --line: #4a3643;
  --accent: #fb7185; --accent-ink: #3b0a17; --accent-soft: rgba(251,113,133,.22); --accent-soft-ink: #fecdd3; /* rose-400 + dark ink = 6.3:1 */
  --control: #d9c6d0; --control-ink: #3b2832;
  --heart: #fb7185; --focus: #d9c6d0; --sel: #5a3a4f; --scrim: rgba(10,5,12,.6);
  --warn-bg: #3d3010; --warn-ink: #ffd98a;
  --been: #4fb89f; --been-ink: #0e2a24;
  --new-bg: #2c3550; --new-ink: #c3cff5; --pick-bg: #4a2030; --pick-ink: #fecdd3;
  --tint-food: #4a2030; --tint-food-ink: #fda4af; --tint-drinks: #34305a; --tint-drinks-ink: #c4bbf5;
  --tint-shop: #43303d; --tint-shop-ink: #e0b5cc; --tint-sights: #2c3550; --tint-sights-ink: #b0c0ee;
  --tint-outdoors: #25423b; --tint-outdoors-ink: #9bdcc4; --tint-activities: #442236; --tint-activities-ink: #e8a6cc;
  --tint-stay: #38384f; --tint-stay-ink: #b4b4d8; --tint-other: #3c3a44; --tint-other-ink: #c4c1cf;
  --map-bg: #2a1d28; --map-water: #1b1a2f; --map-park: #31232f; --map-road: #4c3848; --map-casing: #201520;
  --map-building: #352633; --map-label: #c0a9b9; --map-halo: #2a1d28; --map-pin-halo: rgba(0,0,0,.4); --map-sel: #f6ecf2; --map-user: #6aa2ff;
  --michelin: #b45309; --michelin-soft: #44301a; --michelin-ink: #fcd28d;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35); --shadow-up: 0 -2px 28px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --bg: #1e1520; --surface: #2b1e29; --surface-2: #382836;
    --ink: #f6ecf2; --ink-2: #dbc8d3; --muted: #c4a6b8; --line: #4a3643;
    --accent: #fb7185; --accent-ink: #3b0a17; --accent-soft: rgba(251,113,133,.22); --accent-soft-ink: #fecdd3;
    --control: #d9c6d0; --control-ink: #3b2832; --heart: #fb7185; --focus: #d9c6d0; --sel: #5a3a4f; --scrim: rgba(10,5,12,.6);
    --warn-bg: #3d3010; --warn-ink: #ffd98a; --been: #4fb89f; --been-ink: #0e2a24;
    --new-bg: #2c3550; --new-ink: #c3cff5; --pick-bg: #4a2030; --pick-ink: #fecdd3;
    --tint-food: #4a2030; --tint-food-ink: #fda4af; --tint-drinks: #34305a; --tint-drinks-ink: #c4bbf5;
    --tint-shop: #43303d; --tint-shop-ink: #e0b5cc; --tint-sights: #2c3550; --tint-sights-ink: #b0c0ee;
    --tint-outdoors: #25423b; --tint-outdoors-ink: #9bdcc4; --tint-activities: #442236; --tint-activities-ink: #e8a6cc;
    --tint-stay: #38384f; --tint-stay-ink: #b4b4d8; --tint-other: #3c3a44; --tint-other-ink: #c4c1cf;
    --map-bg: #2a1d28; --map-water: #1b1a2f; --map-park: #31232f; --map-road: #4c3848; --map-casing: #201520;
    --map-building: #352633; --map-label: #c0a9b9; --map-halo: #2a1d28; --map-pin-halo: rgba(0,0,0,.4); --map-sel: #f6ecf2; --map-user: #6aa2ff;
    --michelin-soft: #44301a; --michelin-ink: #fcd28d;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35); --shadow-up: 0 -2px 28px rgba(0,0,0,.45);
  }
}
/* group helper classes: set --tb (tint bg), --ti (tint glyph) and --dc (pin disc) from the group token */
.g-food{--tb:var(--tint-food);--ti:var(--tint-food-ink);--dc:var(--cat-food)}
.g-drinks{--tb:var(--tint-drinks);--ti:var(--tint-drinks-ink);--dc:var(--cat-drinks)}
.g-shop{--tb:var(--tint-shop);--ti:var(--tint-shop-ink);--dc:var(--cat-shop)}
.g-sights{--tb:var(--tint-sights);--ti:var(--tint-sights-ink);--dc:var(--cat-sights)}
.g-outdoors{--tb:var(--tint-outdoors);--ti:var(--tint-outdoors-ink);--dc:var(--cat-outdoors)}
.g-activities{--tb:var(--tint-activities);--ti:var(--tint-activities-ink);--dc:var(--cat-activities)}
.g-stay{--tb:var(--tint-stay);--ti:var(--tint-stay-ink);--dc:var(--cat-stay)}
.g-other{--tb:var(--tint-other);--ti:var(--tint-other-ink);--dc:var(--cat-other)}
@media (prefers-reduced-motion: reduce) {
  :root { --t-fast: 0ms; --t-base: 0ms; --t-sheet: 0ms; --t-pop: 0ms; --t-fly: 0ms; }
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
::selection{background:var(--sel);color:var(--ink)}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:10px}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
input{caret-color:var(--heart)}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic .f,symbol .f{fill:currentColor;fill-opacity:.2}.ic .s,symbol .s{fill:currentColor;stroke:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#map{position:absolute;inset:0;background:var(--map-bg)}
.maplibregl-canvas{outline:none}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}

.ico{width:44px;height:44px;border-radius:50%;background:var(--tb);color:var(--ti);display:grid;place-items:center;flex:none;font-size:23px}
.ico.sm{width:26px;height:26px;font-size:15px}.ico.lg{width:52px;height:52px;font-size:27px}
/* top bar */
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:10px 12px 0;pointer-events:none}
.top>*{pointer-events:auto}
.search{display:flex;align-items:center;height:50px;background:var(--surface);border-radius:25px;box-shadow:var(--shadow);padding:0 6px 0 16px;gap:10px}
.search>.ic{font-size:21px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px;height:48px}
.search input::placeholder{color:var(--muted);opacity:1}
.search:focus-within{box-shadow:var(--shadow),0 0 0 2.5px var(--focus)}
.xq{width:44px;height:44px;display:none;place-items:center;color:var(--muted);font-size:18px;border-radius:50%}
.search.has .xq{display:grid}
.fbtn{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px 0 12px;border-radius:20px;background:var(--surface-2);font-weight:650;font-size:15px;position:relative;margin-right:2px}
.fbtn .ic{font-size:19px}
.fbtn::after{content:"";position:absolute;inset:-3px -2px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--control);color:var(--control-ink);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 12px;margin:0 -12px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;height:44px;padding:0 15px 0 9px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:15px;white-space:nowrap;flex:none;transition:background .2s,color .2s,transform .12s;scroll-snap-align:start}
.chip:active,.fbtn:active,.seg button:active,.cta:active,.btn:active{transform:scale(.97)}
.chip[aria-pressed=true]{background:var(--control);color:var(--control-ink)}
.chip[aria-pressed=true] .ico{background:rgba(255,255,255,.92);color:var(--ti)}
.chip.keyc{padding:0 15px 0 12px;gap:7px}
.chip.keyc .ic{font-size:19px}
/* hearts */
.heart{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:24px;flex:none}
.heart .ic{transition:color .15s}
.heart[aria-pressed=true]{color:var(--heart)}.heart[aria-pressed=true] .ic{fill:currentColor;fill-opacity:1}
.heart i{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#fda4af;opacity:0;pointer-events:none}
.heart.pop .ic{animation:pop .36s cubic-bezier(.3,1.5,.5,1)}
.heart.pop i{animation:dot .5s cubic-bezier(.2,.8,.3,1) forwards}
.heart.pop i:nth-of-type(2){--dx:-15px;--dy:-14px}.heart.pop i:nth-of-type(3){--dx:16px;--dy:-12px}.heart.pop i:nth-of-type(4){--dx:0px;--dy:17px;background:#fb7185}
.heart.unpop .ic{animation:unpop .26s ease-out}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes unpop{0%{transform:scale(1)}45%{transform:scale(.8)}100%{transform:scale(1)}}
@keyframes dot{0%{opacity:.95;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
/* rows */
.row{display:flex;align-items:center;gap:2px;padding:0 6px 0 12px;min-height:76px;position:relative}
.row+.row::before{content:"";position:absolute;left:68px;right:12px;top:0;height:1px;background:var(--line)}
.rmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 0;border-radius:14px}
.rmain:active .ico{transform:scale(.94)}.ico{transition:transform .12s}
.rtx{min-width:0;flex:1}
.rn{font-weight:650;font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{font-size:13px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:9px;background:var(--surface-2);color:var(--ink-2);margin-left:6px;font-style:normal;vertical-align:1px}
.empty{padding:28px 24px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin:14px auto 0}
.endnote{padding:18px 20px 24px;text-align:center;color:var(--muted);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:23px;font-weight:650;font-size:16px;background:var(--surface-2);color:var(--ink);transition:transform .12s}
.btn .ic{font-size:20px}
.cta{background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;font-weight:700;font-size:16px;width:100%;transition:transform .12s}
.cta .ic{font-size:21px}
/* counter */
.counter{display:inline-flex;align-items:center;gap:6px}
.cnum{display:inline-grid;overflow:hidden;height:1.25em;line-height:1.25;font-weight:700;font-variant-numeric:tabular-nums;min-width:.7em;text-align:center}
.cnum>span{grid-area:1/1}.cnum .in{animation:rin .3s cubic-bezier(.2,.9,.3,1)}.cnum .out{animation:rout .3s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes rin{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes rout{to{transform:translateY(-100%);opacity:0}}
.counter.bump{animation:bump .42s cubic-bezier(.3,1.4,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.pill{display:inline-flex;align-items:center;gap:6px;min-width:24px;height:24px;padding:0 8px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);font-size:13px;justify-content:center}
.pill.on{background:var(--accent);color:var(--accent-ink)}
/* markers on map */
.mk-tip{position:absolute;z-index:6;pointer-events:none;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:9px 13px;max-width:260px;transform:translate(-50%,-100%);margin-top:-26px;opacity:0;transition:opacity .15s}
.mk-tip.on{opacity:1}.mk-tip b{display:block;font-size:15px;line-height:1.25}.mk-tip span{font-size:13px;color:var(--ink-2)}
/* peek card */
.pk{display:flex;flex-direction:column;gap:12px;padding:14px 16px 12px;background:var(--surface);touch-action:pan-y}
.pk-top{display:flex;gap:12px;align-items:center}
.pk-top h2{font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.pk-cat{font-size:15px;color:var(--ink-2);margin-top:2px}
.pk-x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);font-size:20px;margin:-6px -8px 0 0;align-self:flex-start;background:var(--surface-2);width:36px;height:36px}
.pk-x::after{content:"";position:absolute;inset:-4px}
.pk-addr{font-size:15px;color:var(--ink-2)}
.pk-note{background:var(--surface-2);border-radius:14px;padding:10px 14px;font-size:15px}
.pk-note small{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:1px}
.pk-act{display:flex;gap:10px;align-items:center}
.hbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:24px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;position:relative;transition:transform .12s,background .2s}
.hbtn .ic{font-size:21px}.hbtn[aria-pressed=true]{background:var(--accent-soft);color:var(--accent-soft-ink)}.hbtn[aria-pressed=true] .ic{fill:currentColor;fill-opacity:1}
.hbtn:active{transform:scale(.97)}
.hbtn.pop .ic{animation:pop .36s cubic-bezier(.3,1.5,.5,1)}.hbtn.unpop .ic{animation:unpop .26s ease-out}
.hbtn i{position:absolute;left:calc(50% - 44px);top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#fda4af;opacity:0}
.hbtn.pop i{animation:dot .5s cubic-bezier(.2,.8,.3,1) forwards}
.hbtn.pop i:nth-of-type(2){--dx:-14px;--dy:-16px}.hbtn.pop i:nth-of-type(3){--dx:16px;--dy:-14px}.hbtn.pop i:nth-of-type(4){--dx:2px;--dy:18px;background:#fb7185}
.mapsbtn{width:48px;height:48px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:21px;color:var(--ink)}

/* Little Travel Book, map configuration (round 3).
   ES module, no dependencies. MapLibre GL JS 4.7.1. Everything the map needs besides data and DOM.
   Pure functions: buildStyle() returns a full style object; call map.setStyle(buildStyle(...)) to switch theme or
   light/dark, then re-add pin images (registerPinImages) on 'style.load' and 'styleimagemissing'.

   Rules baked in (owner, 2026-11-24):
   - NO clustering. One GeoJSON source, every place its own feature at every zoom.
   - Low zoom: small group-coloured dots whose radius grows with zoom. Category icon from ZOOM.iconIn (13.5).
   - Draw order via sort keys: hearted (3) > my lists (2) > other lists (1). Higher rank draws on top.
   - Labels only from ZOOM.labels, with collision (no allow-overlap) so they never pile up.
   - Pins stay legible on standard light and dark: white ring plus a soft dark halo. */

const BASE_STYLE_URL = 'https://tiles.openfreemap.org/styles/positron';   // OpenFreeMap, open data, no key

/* Attribution strings (render in a small credit line; keep it visible, never hidden behind sheets). */
const ATTRIBUTION = {
  standard: '© OpenStreetMap contributors · OpenFreeMap',
};

/* Satellite was DROPPED by the owner (no third-party imagery). The map style follows light/dark only. */

/* Zoom ladder. Round 2 swapped to icons at 11.2 and crowded SF; 13 keeps dots calm through the dense core and still shows icons at neighbourhood zoom. */
const ZOOM = {
  dotsOut: 13.4,      // dots fully gone
  iconIn: 13,         // category icons start (fade 13 to 13.5); dots below
  labels: 15.6,       // place-name labels
  fly: 15,            // zoom used when flying to a chosen place
  denseHint: 14,      // show the "Lots here" chip below this zoom...
  denseCount: 250,    // ...when more than this many places are in view
};

/* ---------- Basemap theme as Protomaps FLAVOR colour objects ----------
   Production basemap = self-hosted Protomaps PMTiles (regional extract); no third-party tile service. With @protomaps/basemaps:
       import { layers } from '@protomaps/basemaps';   const style = layers('protomaps', FLAVOR[theme], { lang: 'en' });
   Keys below are the Flavor fields we override (anything omitted inherits the stock 'light'/'dark' flavor).
   The prototype still renders OpenFreeMap positron (we cannot host PMTiles in a mock), restyled by restyleStandard() from the SAME values:
     OpenFreeMap layer id                       -> Flavor key
     background                                 -> background (and earth)
     water, waterway                            -> water
     park, landcover_wood                       -> park_a, wood_a
     landuse_residential                        -> earth (slightly lifted)
     building                                   -> buildings
     highway_* / road fills (minor, major)      -> minor_a, minor_b, major, highway (all one road colour, calm)
     *_casing                                   -> minor_casing, major_casing_late, highway_casing_late
     label_* / highway-name-* / water_name*     -> city_label, subplace_label, roads_label_minor, roads_label_major, ocean_label, waterway_label
     text-halo                                  -> *_halo keys (city_label_halo, subplace_label_halo, roads_label_*_halo)
   Hidden in both: boundaries, railway, pier, airport shields (set to transparent / omit the layers). */
const FLAVOR = {
  light: { background: '#f1effa', earth: '#f1effa', water: '#d5daf3', park_a: '#e6e9f4', park_b: '#e6e9f4', wood_a: '#e6e9f4', wood_b: '#e6e9f4', buildings: '#e8e4f2',
           minor_a: '#ffffff', minor_b: '#ffffff', link: '#ffffff', major: '#ffffff', highway: '#ffffff', other: '#ffffff',
           minor_casing: '#e0dbee', major_casing_late: '#e0dbee', highway_casing_late: '#e0dbee', pedestrian: '#f1effa', railway: 'transparent', boundaries: 'transparent',
           city_label: '#6d5c7c', city_label_halo: '#ffffff', subplace_label: '#6f5f80', subplace_label_halo: '#ffffff', roads_label_minor: '#6f5f80', roads_label_minor_halo: '#ffffff',
           roads_label_major: '#6f5f80', roads_label_major_halo: '#ffffff', ocean_label: '#7d86b8', waterway_label: '#7d86b8' },
  dark:  { background: '#2a1d28', earth: '#2f2230', water: '#1b1a2f', park_a: '#31232f', park_b: '#31232f', wood_a: '#31232f', wood_b: '#31232f', buildings: '#352633',
           minor_a: '#4c3848', minor_b: '#4c3848', link: '#4c3848', major: '#4c3848', highway: '#4c3848', other: '#4c3848',
           minor_casing: '#201520', major_casing_late: '#201520', highway_casing_late: '#201520', pedestrian: '#2f2230', railway: 'transparent', boundaries: 'transparent',
           city_label: '#d9c6d0', city_label_halo: '#2a1d28', subplace_label: '#c0a9b9', subplace_label_halo: '#2a1d28', roads_label_minor: '#c0a9b9', roads_label_minor_halo: '#2a1d28',
           roads_label_major: '#c0a9b9', roads_label_major_halo: '#2a1d28', ocean_label: '#8f8ec0', waterway_label: '#8f8ec0' },
};
const fromFlavor = (f, extra) => ({ bg: f.background, water: f.water, park: f.park_a, land: f.earth, road: f.minor_a, casing: f.minor_casing, build: f.buildings, text: f.subplace_label, halo: f.subplace_label_halo, ...extra });
/* Palettes drive restyleStandard (prototype) and pins; mirror tokens.css --map-* (MapLibre cannot read CSS variables). */
const PALETTE = {
  light: fromFlavor(FLAVOR.light, { pinHalo: 'rgba(59,40,50,.22)', sel: '#6c495b', name: '#4a3340', user: '#2f6fd6' }),
  dark:  fromFlavor(FLAVOR.dark,  { pinHalo: 'rgba(0,0,0,.4)', sel: '#f6ecf2', name: '#f1e4eb', user: '#6aa2ff' }),
};
const HEART = '#f43f5e', BEEN = '#2f7d6b';

/* ---------- Standard: OpenFreeMap positron restyled calm. layer id -> paint ---------- */
function restyleStandard(base, theme) {
  const c = PALETTE[theme];
  const s = JSON.parse(JSON.stringify(base));
  s.layers.forEach((l) => {
    l.paint = l.paint || {};
    const id = l.id, ty = l.type;
    if (ty === 'background') l.paint['background-color'] = c.bg;
    else if (ty === 'fill') {
      if (id === 'water') l.paint['fill-color'] = c.water;
      else if (id === 'park' || id === 'landcover_wood') { l.paint['fill-color'] = c.park; l.paint['fill-opacity'] = 0.9; }
      else if (id === 'landuse_residential') { l.paint['fill-color'] = c.land; l.paint['fill-opacity'] = 0.7; }
      else if (id === 'building') { l.paint['fill-color'] = c.build; l.paint['fill-opacity'] = 0.6; delete l.paint['fill-outline-color']; }
      else if (id === 'road_area_pier') l.paint['fill-color'] = c.road;
      else l.layout = { ...(l.layout || {}), visibility: 'none' };
    } else if (ty === 'line') {
      if (/boundary|aeroway|railway|tunnel|path|pier|subtle/.test(id)) l.layout = { ...(l.layout || {}), visibility: 'none' };
      else if (id === 'waterway') l.paint['line-color'] = c.water;
      else if (/casing/.test(id)) { l.paint['line-color'] = c.casing; l.paint['line-opacity'] = theme === 'dark' ? 0.9 : 0.6; }
      else { l.paint['line-color'] = c.road; delete l.paint['line-opacity']; }
    } else if (ty === 'symbol') {
      if (/airport|shield|path/.test(id)) l.layout = { ...(l.layout || {}), visibility: 'none' };
      else { l.paint['text-color'] = c.text; l.paint['text-halo-color'] = c.halo; l.paint['text-halo-width'] = 1.6; }
    }
  });
  return s;
}

/* ---------- Pin layers (appended after the base layers, so pins sit above map labels) ---------- */
/* Feature properties expected on the 'places' source:
   { id, n (name), ic ('pin-<category>'), col (group colour), rank (3 hearted, 2 mine, 1 other), been (bool) } */
function pinLayers({ theme = 'dark', picks = [], hasGlyphs = true } = {}) {
  const pal = PALETTE[theme];
  const pre = 'pin-';
  const none = ['==', ['get', 'id'], -1];
  const iconSize = ['interpolate', ['linear'], ['zoom'], 13, 0.78, 15, 0.92, 17, 1.08, 19, 1.2];
  const fade = ['interpolate', ['linear'], ['zoom'], ZOOM.iconIn, 0, ZOOM.iconIn + 0.5, 1];
  const dotFade = ['interpolate', ['linear'], ['zoom'], 12.9, 1, ZOOM.dotsOut, 0];
  const dotRad = (add = 0) => ['interpolate', ['linear'], ['zoom'], 8, 2.2 + add, 11, 3.2 + add, 12.5, 4.6 + add, 13, 6 + add];   // radius scales with zoom (zoom may only feed a top-level interpolate)
  const dotR = dotRad();
  const L = [
    // soft dark halo under every dot: keeps colours separable on the pale map
    { id: 'dots-halo', type: 'circle', source: 'places', maxzoom: ZOOM.dotsOut,
      layout: { 'circle-sort-key': ['get', 'rank'] },
      paint: { 'circle-color': pal.pinHalo, 'circle-radius': dotRad(2.6), 'circle-blur': 0.8, 'circle-opacity': dotFade } },
    { id: 'dots', type: 'circle', source: 'places', maxzoom: ZOOM.dotsOut,
      layout: { 'circle-sort-key': ['get', 'rank'] },   // hearted on top, then mine, then other
      paint: { 'circle-color': ['get', 'col'], 'circle-radius': dotR, 'circle-stroke-color': '#ffffff',
               'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 8, 1, 13, 1.8], 'circle-opacity': dotFade, 'circle-stroke-opacity': dotFade } },
    { id: 'dots-heart', type: 'circle', source: 'places', maxzoom: ZOOM.dotsOut, filter: ['==', ['get', 'rank'], 3],
      paint: { 'circle-color': HEART, 'circle-radius': dotRad(2), 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 2, 'circle-opacity': dotFade, 'circle-stroke-opacity': dotFade } },
    { id: 'sel-halo', type: 'circle', source: 'places', filter: none,
      paint: { 'circle-color': pal.sel, 'circle-opacity': 0.2, 'circle-radius': 24, 'circle-stroke-color': pal.sel, 'circle-stroke-width': 2, 'circle-stroke-opacity': 0.8 } },
    // category icon pins: disc in group colour + white glyph + white ring + soft dark halo (baked into the image)
    { id: 'pins', type: 'symbol', source: 'places', minzoom: ZOOM.iconIn,
      layout: { 'icon-image': ['concat', pre, ['get', 'cat']], 'icon-size': iconSize, 'icon-allow-overlap': true, 'icon-ignore-placement': true, 'symbol-sort-key': ['get', 'rank'] },
      paint: { 'icon-opacity': fade } },
    { id: 'pins-sel', type: 'symbol', source: 'places', filter: none,
      layout: { 'icon-image': ['concat', pre, ['get', 'cat']], 'icon-size': ['interpolate', ['linear'], ['zoom'], 8, 1.2, 13, 1.35, 17, 1.5], 'icon-allow-overlap': true, 'icon-ignore-placement': true } },
    // hearted: small rose heart badge at the top-right; been: small teal check badge at the bottom-right
    { id: 'pins-heart', type: 'symbol', source: 'places', minzoom: ZOOM.iconIn, filter: ['==', ['get', 'rank'], 3],
      layout: { 'icon-image': 'heart-badge', 'icon-size': iconSize, 'icon-offset': [14, -14], 'icon-allow-overlap': true, 'icon-ignore-placement': true } },
    { id: 'pins-been', type: 'symbol', source: 'places', minzoom: ZOOM.iconIn, filter: ['==', ['get', 'been'], true],
      layout: { 'icon-image': 'been-badge', 'icon-size': iconSize, 'icon-offset': [14, 14], 'icon-allow-overlap': true, 'icon-ignore-placement': true } },
    // been on a dot (low zoom): a small ring so it is still quiet but findable
    { id: 'dots-been', type: 'circle', source: 'places', maxzoom: ZOOM.dotsOut, filter: ['==', ['get', 'been'], true],
      paint: { 'circle-color': 'rgba(0,0,0,0)', 'circle-radius': dotRad(2.4), 'circle-stroke-color': BEEN, 'circle-stroke-width': 2, 'circle-stroke-opacity': dotFade } },
    // Michelin layer (US-wide, OFF by default): unsaved points. Tiny dots at national zoom, outlined award pins at city zoom.
    // Saved places always draw above (these layers are inserted BEFORE the saved dots/pins, see buildStyle).
    // the visitor's own location (Locate me)
    { id: 'user-acc', type: 'circle', source: 'user', paint: { 'circle-color': pal.user, 'circle-opacity': 0.14, 'circle-radius': 0, 'circle-stroke-color': pal.user, 'circle-stroke-width': 1, 'circle-stroke-opacity': 0.35 } },   // radius set by userAccuracyRadius()
    { id: 'user-pulse', type: 'circle', source: 'user', paint: { 'circle-color': pal.user, 'circle-opacity': 0.4, 'circle-radius': 8 } },   // animated by pulseUser(); static under reduced motion
    { id: 'user-dot', type: 'circle', source: 'user', paint: { 'circle-color': pal.user, 'circle-radius': 7, 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 3 } },
  ];
  if (hasGlyphs) L.push({ id: 'pin-names', type: 'symbol', source: 'places', minzoom: ZOOM.labels,
    layout: { 'text-field': ['get', 'n'], 'text-font': ['Noto Sans Regular'], 'text-size': 12, 'text-offset': [0, 1.6], 'text-anchor': 'top', 'text-max-width': 8,
              'text-optional': true, 'symbol-sort-key': ['-', 0, ['get', 'rank']] /* collision winners: hearted first */ },
    paint: { 'text-color': pal.name, 'text-halo-color': pal.halo, 'text-halo-width': 1.7 } });
  return L;
}

/* Full style for the current theme + mode. data = GeoJSON FeatureCollection of places. */
function buildStyle(base, { theme = 'dark', data, picks = [], michelinData = null, michelinOn = false, michelinFilter = null } = {}) {
  const s = restyleStandard(base, theme);
  s.sources.places = { type: 'geojson', data };                 // NO cluster option, on purpose
  s.sources.user = { type: 'geojson', data: { type: 'FeatureCollection', features: [] } };
  s.sources.michelin = michelinData ? { type: 'geojson', data: michelinData } : MICHELIN_SOURCE;   // prototype passes synthetic GeoJSON; production passes nothing (PMTiles)
  const pins = pinLayers({ theme, picks, hasGlyphs: !!base.glyphs });
  // order: michelin layer first (underneath), then saved dots/pins on top
  const ml = michelinLayers(michelinOn, michelinFilter);
  if (michelinData) ml.forEach((l) => delete l['source-layer']);   // GeoJSON demo source has no source-layer
  s.layers.push(...ml, ...pins, ...michelinBadgeLayer());
  return s;
}

/* Feature builder: one place -> GeoJSON feature. rank: hearted 3, my lists 2, other lists 1. */
function toFeature(p, { hearted = false, groupColor } = {}) {
  return { type: 'Feature', properties: { id: p.i, n: p.n, cat: p.c, col: groupColor, rank: hearted ? 3 : (p.s === 'm' ? 2 : 1), been: !!p.b, mich: !!(p.mi && p.mi.length) },
           geometry: { type: 'Point', coordinates: [p.lng, p.lat] } };
}

/* ---------- Pin images: draw SVG to canvas, map.addImage(id, imageData, {pixelRatio: 2}) ---------- */
/* glyphs: { [categoryId]: '<path .../>' } from icons.svg inner markup (classes .f = soft fill, .s = solid). */
const pinSVG = (glyph, color) => `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><style>.f{fill:#fff;fill-opacity:.28}.s{fill:#fff;stroke:none}</style>
<circle cx="32" cy="33" r="29" fill="rgba(0,0,0,.2)"/><circle cx="32" cy="32" r="28.5" fill="rgba(0,0,0,.1)"/>
<circle cx="32" cy="32" r="26" fill="#fff"/><circle cx="32" cy="32" r="22.5" fill="${color}"/>
<g transform="translate(15.5 15.5) scale(1.35)" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${glyph}</g></svg>`;
const heartBadgeSVG = (path) => `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="21" r="18" fill="rgba(0,0,0,.25)"/><circle cx="20" cy="20" r="17" fill="#fff"/><g transform="translate(8.4 8.4) scale(1.1)"><path d="${path}" fill="${HEART}" stroke="${HEART}" stroke-width="2" stroke-linejoin="round"/></g></svg>`;
const beenBadgeSVG = () => `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="21" r="18" fill="rgba(0,0,0,.25)"/><circle cx="20" cy="20" r="17" fill="#fff"/><circle cx="20" cy="20" r="13" fill="${BEEN}"/><path d="M13.5 20.5l4.6 4.6 8.4-9.4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function svgToImageData(svg, px) {
  return new Promise((res) => { const im = new Image(); im.onload = () => { const cv = document.createElement('canvas'); cv.width = cv.height = px; const x = cv.getContext('2d'); x.drawImage(im, 0, 0, px, px); res(x.getImageData(0, 0, px, px)); }; im.onerror = () => res(null); im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
}
async function loadPinImages({ categories, glyphs, groupColors, heartPath }) {
  const out = {}; const jobs = [];
  Object.keys(categories).forEach((k) => {
    const col = groupColors[categories[k].group];
    jobs.push(svgToImageData(pinSVG(glyphs[k], col), 64).then((d) => { out['pin-' + k] = d; }));
  });
  jobs.push(svgToImageData(heartBadgeSVG(heartPath), 40).then((d) => { out['heart-badge'] = d; }));
  jobs.push(svgToImageData(beenBadgeSVG(), 40).then((d) => { out['been-badge'] = d; }));
  await Promise.all(jobs); return out;
}
function registerPinImages(map, images) { Object.entries(images).forEach(([k, v]) => { if (v && !map.hasImage(k)) map.addImage(k, v, { pixelRatio: 2 }); }); }

/* Dense-area hint: show the chip when inViewCount > ZOOM.denseCount and zoom < ZOOM.denseHint, until dismissed. */
const shouldHintDense = (inViewCount, zoom, dismissed) => !dismissed && zoom < ZOOM.denseHint && zoom > 9 && inViewCount > ZOOM.denseCount;

/* ---------- Michelin layer (owner, 2026-11-24): WORLDWIDE, ~15-20k restaurants, including unsaved ones ----------
   Architecture (must not lag): MapLibre GPU circle + symbol layers only, never DOM markers, NO clustering.
   Data = ONE PMTiles vector file, fetched by HTTP range requests, only for tiles in view, and only after the toggle is first switched on.
   Register the protocol once before creating the map:
       import { Protocol } from 'pmtiles'; maplibregl.addProtocol('pmtiles', new Protocol().tile);
   Tile feature properties (minimal): id, best ('3s'|'2s'|'1s'|'bib'|'green'|'sel'), yr (latest year), name (labels at high zoom).
   Full awards-by-year load on tap from a per-id lookup, then render in the peek / place card.
   Unsaved = OUTLINE pin (ring in the best-award colour, light centre, rosette glyph); saved places keep their FILLED category pin and gain the small
   award badge. Saved layers are added AFTER these, so saved always draw above. We draw our own neutral rosette; never Michelin's logos. */
const MICHELIN_SOURCE = { type: 'vector', url: 'pmtiles://michelin.pmtiles', minzoom: 0, maxzoom: 14, attribution: 'Michelin Guide data (sample in this prototype)' };
const MICHELIN_SOURCE_LAYER = 'michelin';
/* Award colour scale: in-family, distinct, each >= 4.5:1 against white (ring and badge sit on a white halo, so they read on standard lightand dark).
   Stars amber, Bib teal-blue, Green Star green, Selected stone. 1/2/3 stars share the star colour; 3 stars draw slightly larger. */
const AWARD = {
  star:  { color: '#b45309', label: 'Michelin Star' },
  bib:   { color: '#0e7490', label: 'Bib Gourmand' },
  green: { color: '#15803d', label: 'Green Star' },
  sel:   { color: '#78716c', label: 'Selected' },
};
const MICHELIN_COLOR = AWARD.star.color;
const awardKind = (best) => (/s$/.test(best) ? 'star' : best);
const colorBy = ['match', ['get', 'best'], ['3s', '2s', '1s'], AWARD.star.color, 'bib', AWARD.bib.color, 'green', AWARD.green.color, AWARD.sel.color];
const iconBy = ['match', ['get', 'best'], ['3s', '2s', '1s'], 'mich-star', 'bib', 'mich-bib', 'green', 'mich-green', 'mich-sel'];
/* Chip filter expressions. Chips: "Michelin stars" -> ['3s','2s','1s'], "Bib Gourmand" -> ['bib'], plus Green Star / Selected in the Filters sheet.
   'any year' (2022-2026) uses every feature; 'current edition' adds yr == CURRENT_EDITION. With the layer off the same chips filter saved places. */
const CURRENT_EDITION = 2025;   // set to the latest edition present in the data (prototype sample uses 2025)
const michelinFilter = ({ bests = [], currentOnly = false } = {}) => {
  const f = ['all'];
  if (bests.length) f.push(['in', ['get', 'best'], ['literal', bests]]);
  if (currentOnly) f.push(['==', ['get', 'yr'], CURRENT_EDITION]);
  return f.length === 1 ? null : f;
};
ZOOM.michelinBadge = 15;     // award badge on saved pins (high zoom only)
ZOOM.michelinPins = 9.5;     // outlined award pins from here; tiny best-award dots below (z0 to 9.5)
const michelinLayers = (visible = false, filter = null) => {
  const vis = { visibility: visible ? 'visible' : 'none' };
  const dotR = ['interpolate', ['linear'], ['zoom'], 0, 1.8, 3, 2.4, 6, 2.8, 8, 3.2, 9.5, 4.2];
  const sort = ['match', ['get', 'best'], '3s', 6, '2s', 5, '1s', 4, 'bib', 3, 'green', 2, 1];   // best awards on top, all under saved pins
  return [
    { id: 'mich-dots', type: 'circle', source: 'michelin', 'source-layer': MICHELIN_SOURCE_LAYER, maxzoom: ZOOM.michelinPins + 0.8, ...(filter ? { filter } : {}),
      layout: { ...vis, 'circle-sort-key': sort },
      paint: { 'circle-color': colorBy, 'circle-radius': dotR, 'circle-stroke-color': '#ffffff', 'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 3, 0.6, 9, 1.2],
               'circle-opacity': ['interpolate', ['linear'], ['zoom'], ZOOM.michelinPins, 1, ZOOM.michelinPins + 0.8, 0],
               'circle-stroke-opacity': ['interpolate', ['linear'], ['zoom'], ZOOM.michelinPins, 1, ZOOM.michelinPins + 0.8, 0] } },
    { id: 'mich-pins', type: 'symbol', source: 'michelin', 'source-layer': MICHELIN_SOURCE_LAYER, minzoom: ZOOM.michelinPins, ...(filter ? { filter } : {}),
      layout: { ...vis, 'icon-image': iconBy, 'icon-size': ['interpolate', ['linear'], ['zoom'], 9.5, 0.5, 12, 0.7, 14, 0.88, 17, 1.05], 'icon-allow-overlap': true, 'icon-ignore-placement': true, 'symbol-sort-key': sort },
      paint: { 'icon-opacity': ['interpolate', ['linear'], ['zoom'], ZOOM.michelinPins, 0, ZOOM.michelinPins + 0.8, 1] } },
    { id: 'mich-names', type: 'symbol', source: 'michelin', 'source-layer': MICHELIN_SOURCE_LAYER, minzoom: ZOOM.labels, ...(filter ? { filter } : {}),
      layout: { ...vis, 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'], 'text-size': 12, 'text-offset': [0, 1.6], 'text-anchor': 'top', 'text-max-width': 8, 'text-optional': true },
      paint: { 'text-color': '#7c3a07', 'text-halo-color': '#ffffff', 'text-halo-width': 1.7 } },
  ];
};
const michelinBadgeLayer = () => [
  { id: 'mich-badge', type: 'symbol', source: 'places', minzoom: ZOOM.michelinBadge, filter: ['==', ['get', 'mich'], true],
    layout: { 'icon-image': 'mich-badge', 'icon-size': ['interpolate', ['linear'], ['zoom'], 15, 0.8, 17, 1], 'icon-offset': [-14, -14], 'icon-allow-overlap': true, 'icon-ignore-placement': true } },
];
const setMichelinVisible = (map, on) => ['mich-dots', 'mich-pins', 'mich-names'].forEach((id) => map.getLayer(id) && map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'));
const setMichelinFilter = (map, f) => ['mich-dots', 'mich-pins', 'mich-names'].forEach((id) => map.getLayer(id) && map.setFilter(id, f));
const AWARD_GLYPH = '<circle cx="12" cy="9.5" r="5.2"/><path d="M8.6 13.6L7 21l5-2.6 5 2.6-1.6-7.4"/>';   // rosette with ribbons, same as icons.svg #u-award
const michelinPinSVG = (color) => `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="33" r="29" fill="rgba(0,0,0,.3)"/><circle cx="32" cy="32" r="28.5" fill="#fff"/><circle cx="32" cy="32" r="24.5" fill="rgba(255,252,250,.96)" stroke="${color}" stroke-width="4"/><g transform="translate(15.5 15.5) scale(1.35)" fill="none" stroke="${color}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${AWARD_GLYPH}</g></svg>`;
const michelinBadgeSVG = () => `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="21" r="18" fill="rgba(0,0,0,.25)"/><circle cx="20" cy="20" r="17" fill="#fff"/><circle cx="20" cy="20" r="13" fill="${MICHELIN_COLOR}"/><g transform="translate(8.5 8.5) scale(.96)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${AWARD_GLYPH}</g></svg>`;
async function loadMichelinImages() {
  const o = { 'mich-badge': await svgToImageData(michelinBadgeSVG(), 40) };
  for (const k of ['star', 'bib', 'green', 'sel']) o['mich-' + k] = await svgToImageData(michelinPinSVG(AWARD[k].color), 64);
  return o;
}

/* ---------- Locate me: accuracy halo + pulse ----------
   Position never leaves the browser: only the map and the list distance use it, nothing is sent or stored.
   Accuracy halo in metres -> pixels: radius = metres / (156543.03 * cos(lat) / 2^zoom); an exponential interpolate on zoom stays GPU-side. */
const userAccuracyRadius = (metres, lat) => { const k = (z) => metres / (156543.03 * Math.cos(lat * Math.PI / 180) / Math.pow(2, z)); return ['interpolate', ['exponential', 2], ['zoom'], 8, k(8), 20, k(20)]; };
function setUser(map, lng, lat, acc = 60) {
  map.getSource('user').setData({ type: 'FeatureCollection', features: [{ type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: [lng, lat] } }] });
  map.setPaintProperty('user-acc', 'circle-radius', userAccuracyRadius(acc, lat));
}
function clearUser(map) { map.getSource('user').setData({ type: 'FeatureCollection', features: [] }); }

 if(s==='prompt')c.innerHTML=`<div class="lc-i">${ic('u-locate')}</div><div class="lc-t"><b>Show places near you?</b>Your position stays in this browser. It is never sent anywhere or saved.</div><div class="lc-a"><button class="btn" data-act="locno">Not now</button><button class="btn pri" data-act="locyes">Use my location</button></div>`;
 else if(s==='denied')c.innerHTML=`<div class="lc-i off">${ic('u-locate')}</div><div class="lc-t"><b>Location is off.</b>You can still search or move the map.<details><summary>How to turn it on</summary>Allow location for this site in your browser's site settings, then tap the locate button again. Nothing leaves your device.</details></div><button class="ibtn lc-x" data-act="locno" aria-label="Dismiss">${ic('u-close')}</button>`}
function userAt(lng,lat,acc,fly){USER=[lng,lat,acc];setUser(map,lng,lat,acc);unpulse();unpulse=pulseUser(map,RM);setLoc('located');if(fly)map.easeTo({center:[lng,lat],zoom:14.5,padding:pad(),duration:RM?0:700});syncView()}
function locate(){if(LOC==='located'&&USER){map.easeTo({center:[USER[0],USER[1]],zoom:14.5,padding:pad(),duration:RM?0:600});return}if(LOC!=='asked'&&LOC!=='denied'&&!SEEN_PROMPT){SEEN_PROMPT=true;setLoc('prompt');return}startLocate()}
let SEEN_PROMPT=false;
function startLocate(){if(!navigator.geolocation){setLoc('denied');return}setLoc('locating');toast('Finding you...');navigator.geolocation.getCurrentPosition(pos=>{userAt(pos.coords.longitude,pos.coords.latitude,pos.coords.accuracy||60,true);toast('Here you are')},()=>{setLoc('denied')},{enableHighAccuracy:false,timeout:8000,maximumAge:60000})}
/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!e.target.closest('.sortmenu,[data-act=sort]'))$$('.sortmenu').forEach(m=>m.classList.remove('on'));if(!t){if(!e.target.closest('.search,#sugg'))closeSugg();return}const a=t.dataset.act,id=+t.dataset.id;
 switch(a){
 case 'heart':toggleHeart(id,t);break;
 case 'open':openPlace(id,false);break;
 case 'chip':{const g=t.dataset.chip;F.groups.has(g)?F.groups.delete(g):F.groups.add(g);applyF();break}
 case 'mk':{const k=t.dataset.mk;F.mk.has(k)?F.mk.delete(k):F.mk.add(k);applyF();break}
 case 'mcur':F.mcur=t.dataset.mcur==='cur';applyF();break;
 case 'src':{const k=t.dataset.src;if(k==='mich'){F.mich=!F.mich;applyF();if(F.mich)toast('Michelin layer on. Sample points only in this prototype.');break}if(F[k]&&!F[k==='mine'?'other':'mine'])break;F[k]=!F[k];applyF();break}
 case 'been':F.been=!F.been;applyF();break;
 case 'reg':F.region=t.dataset.reg;applyF({fit:true});break;
 case 'clear':F.groups.clear();F.lists.clear();F.mk.clear();F.mine=F.other=true;F.mich=false;F.mcur=false;F.been=false;F.region='all';F.q='';{const q=$('#q');if(q)q.value=''}applyF();if($('#filtersHost').firstChild)renderFilters();break;
 case 'xq':F.q='';$('#q').value='';closeSugg();applyF();$('#q').focus();break;
 case 'more':shown+=120;$('#listBody').innerHTML=listHTML();break;
 case 'fitall':fitTo(FP,14);break;
 case 'theme':toggleTheme();break;
 case 'openF':renderFilters();if(PHONE)openM('filtersSheet');else $('#panel').dataset.view='filters';break;
 case 'closeF':PHONE?closeM():$('#panel').dataset.view='list';break;
 case 'closeM':PHONE?closeM():closeSide();break;
 case 'closePeek':closePeek();break;
 case 'prev':go(-1);break;case 'next':go(1);break;
 case 'send':send();break;case 'copytext':copy(pickText(),'Copied to your clipboard');break;
 case 'key':if(PHONE){$('#legendHost').innerHTML=legendHTML();openM('legendSheet')}else{const lp=$('#legpop');if(lp.classList.contains('on'))lp.classList.remove('on');else{$('#legendHost').innerHTML=legendHTML();lp.classList.add('on')}}break;
 case 'tab':{const tb=t.dataset.tab;if(tb==='places'){setPage('places');closeM()}else if(tb==='shows'){closeM();setPage('shows')}else if(tb==='picks'){renderPicks();openM('picksSheet')}break}
 case 'side':openSide(t.dataset.side);break;
 case 'sort':{const m=t.parentElement.querySelector('.sortmenu');m.classList.toggle('on');break}
 case 'sortset':SORT=t.dataset.v;$$('.sortmenu').forEach(m=>{m.classList.remove('on');$$('button',m).forEach(b=>b.setAttribute('aria-checked',b.dataset.v===SORT))});syncView();break;
 case 'seg':snapTo(t.dataset.seg==='list'?'full':'peek');break;
 case 'zin':map.zoomIn();break;case 'zout':map.zoomOut();break;
 case 'locate':locate();break;
 case 'locyes':setLoc('asked');startLocate();break;
 case 'locno':setLoc(USER?'located':'idle');break;
 case 'spinx':clearSearchPin();break;
 case 'sgplace':{const s=SG[+t.dataset.i];$('#q').value=s.p.n;$('#q').blur();openPlace(s.p.i,false);break}
 case 'sgmich':{const s=SG[+t.dataset.i];const co=s.f.geometry.coordinates;F.mich=true;applyF();$('#q').value=s.f.properties.name;closeSugg();openMich({...s.f.properties});break}
 case 'sgarea':{const s=SG[+t.dataset.i];$('#q').value=s.a[0];closeSugg();$('#q').blur();dropSearchPin(s.a[1],s.a[2],s.a[0],s.a[3]);break}
 case 'sgaddr':{const s=SG[+t.dataset.i];$('#q').value=s.q;closeSugg();$('#q').blur();dropSearchPin(-122.4214,37.7629,s.q+' (example)',16);break}
 case 'sgcat':{const s=SG[+t.dataset.i];F.groups.add(C[s.cat].g);$('#q').value='';closeSugg();applyF({fit:true});break}
 case 'dense':openFromHint();break;
 case 'offX':$('#offline').classList.remove('on');break;
 case 'denseX':dense.dismissed=true;denseHint();break;
 }});
function openFromHint(){dense.dismissed=true;denseHint();renderFilters();PHONE?openM('filtersSheet'):($('#panel').dataset.view='filters')}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act==='list'){t.checked?F.lists.add(t.dataset.list):F.lists.delete(t.dataset.list);applyF()}else if(t.dataset.act==='been2'){F.been=t.checked;applyF()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSugg();if(PHONE){closeM();if(peekOn)closePeek()}else{closeSide();$('#legpop').classList.remove('on');if($('#panel').dataset.view!=='list'){closePeek();$('#panel').dataset.view='list'}}}});
$('#scrim')&&$('#scrim').addEventListener('click',()=>closeM());
function toggleTheme(){root.dataset.theme=theme()==='dark'?'light':'dark';try{localStorage.setItem('tb-theme',root.dataset.theme)}catch(e){}$$('[data-act=theme] use').forEach(u=>u.setAttribute('href',theme()==='dark'?'#u-sun':'#u-moon'));if(mapReady)map.setStyle(mstyle())}
const qi=$('#q');qi.addEventListener('input',e=>{const v=e.target.value;if(F.q){F.q='';applyF()}openSugg(v);$('.search').classList.toggle('has',!!v)});
qi.addEventListener('focus',()=>{if(qi.value)openSugg(qi.value)});
qi.addEventListener('keydown',e=>{if(e.key==='Enter'){F.q=qi.value.trim().toLowerCase();closeSugg();applyF();qi.blur();if(F.q&&FP.length)fitTo(FP,15)}});
/* swipe on peek */
if(PHONE){const tr=$('#pkTrack');let s=null;let swiped=false;tr.addEventListener('click',e=>{if(swiped){e.stopPropagation();e.preventDefault()}},true);tr.addEventListener('pointerdown',e=>{s={x:e.clientX,y:e.clientY,t:performance.now(),on:false}});
 window.addEventListener('pointermove',e=>{if(!s)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;if(!s.on){if(Math.abs(dx)<10||Math.abs(dx)<Math.abs(dy))return;s.on=true;try{tr.setPointerCapture(e.pointerId)}catch(_){}}tr.style.transition='none';const ed=(PK.i===0&&dx>0)||(PK.i===PK.ids.length-1&&dx<0);tr.style.transform=`translateX(${ed?dx*.25:dx}px)`;tr.style.opacity=1-Math.min(Math.abs(dx)/320,.4)});
 const fin=e=>{if(!s)return;const dx=e.clientX-s.x;const v=dx/(performance.now()-s.t);if(s.on){swiped=true;setTimeout(()=>swiped=false,80);tr.style.transition='';tr.style.transform='';tr.style.opacity=1;if(Math.abs(dx)>70||Math.abs(v)>.5)go(dx<0?1:-1)}s=null};window.addEventListener('pointerup',fin);window.addEventListener('pointercancel',fin);
 const pe=$('#peek');let dy0=null;pe.addEventListener('pointerdown',e=>{if(!e.target.closest('.pk-top,.pk-addr'))return;dy0=e.clientY});pe.addEventListener('pointerup',e=>{if(dy0!=null&&e.clientY-dy0>60)closePeek();dy0=null})}

$('#chips').innerHTML=quickHTML();$('#chips').classList.add('quick');credit();
$$('.sortmenu').forEach(m=>m.innerHTML=Object.keys(SORTN).map(k=>`<button role="menuitemradio" aria-checked="${k===SORT}" data-act="sortset" data-v="${k}">${SORTN[k]}${ic('u-check')}</button>`).join(''));
if(PHONE){$('#shows').innerHTML=showsHTML();initSheet();}
updCounters(false);updBadges();VIEWP=FP.slice(0,60);drawList();
initMap().then(()=>{const run=()=>setTimeout(boot2,150);mapReady?run():map.once('load',run)});
function boot2(){
 const s=H.get('s');
 if(F.mich||F.mk.size||F.been){applyF()}
 if(s==='filters'){renderFilters();PHONE?openM('filtersSheet'):($('#panel').dataset.view='filters')}
 else if(s==='peek'||s==='mich0'||s==='owner'&&false){const p=byName(H.get('p'));if(p){setTimeout(()=>openPlace(p.i,false),400)}}
 else if(s==='picks'){PHONE?(renderPicks(),openM('picksSheet')):openSide('picks')}
 else if(s==='shows'){PHONE?setPage('shows'):openSide('shows')}
 else if(s==='legend'){$('#legendHost').innerHTML=legendHTML();PHONE?openM('legendSheet'):$('#legpop').classList.add('on')}
 else if(s==='search'){qi.value=H.get('q')||'';openSugg(qi.value);$('.search').classList.add('has')}
 else if(s==='owner'&&PHONE){const p=P.find(x=>x.syn);F.q='';snapTo('full',false);setTimeout(()=>{const l=$('#listBody');l.scrollTop=0},50)}
 if(H.get('offline'))$('#offline').classList.add('on');
 const lc=H.get('loc');if(lc==='prompt')setLoc('prompt');else if(lc==='denied')setLoc('denied');else if(lc==='locating'){setLoc('locating');toast('Finding you...');clearTimeout(toastT)}else if(lc==='located'){userAt(-122.4147,37.7616,70,false);map.jumpTo({center:[-122.4147,37.7616],zoom:H.get('z')?+H.get('z'):14.2})}
 if(H.get('sp')){const ar=AREAS.find(x=>x[0].startsWith(H.get('sp')));if(ar){$('#q').value=ar[0];dropSearchPin(ar[1],ar[2],ar[0],ar[3])}}
 if(H.get('sh')&&PHONE)snapTo(H.get('sh'),false);
 if(H.get('picks')&&PHONE&&!s)setTimeout(()=>{renderPicks();openM('picksSheet')},300);
}
