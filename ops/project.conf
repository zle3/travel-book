# Project identity and settings. Sourced by scripts/ops/lib.sh and scripts/deploy.sh (plain shell, no commands).
# Written by kotone-new; `kotone-upgrade` reads it to render framework files for this project. Edit with care.
KOTONE_SLUG="travel-book"
KOTONE_PROJECT_NAME="Little Travel Book"
KOTONE_SITE_DOMAIN="travel.zachle.info"
KOTONE_WORKER_NAME="travel-book"
KOTONE_GH_REPO="zle3/travel-book"
KOTONE_OWNER_NAME="Zach Le"
KOTONE_MODE="new"
KOTONE_SOURCE_DOMAIN=""
# Production deploy guard (scripts/deploy.sh): refuse to ship while any listed file/dir still matches the pattern.
# Owner-only content stays a visible placeholder until the owner supplies it. Empty paths = guard off.
# Stays src/data: the starter ships src/data/content.ts with a visible placeholder example (placeholder: true), so the guard is
# live from day one. Narrow or widen the paths only with the owner; empty turns the guard off.
KOTONE_PLACEHOLDER_PATHS="src/data"
KOTONE_PLACEHOLDER_PATTERN="placeholder: true"
# Optional (a project that adopted the framework with its own names): state dir under .git, and a legacy env prefix
# whose variables are also read as KOTONE_* (scripts/ops/lib.sh, scripts/deploy.sh). Leave unset for new projects.
# KOTONE_OPS_DIRNAME="kotone-ops"
# KOTONE_LEGACY_PREFIX=""
# Merge queue (scripts/ops/mq.sh). Written as "${VAR:-default}" so an environment variable of the same name overrides the file.
# KOTONE_MQ_BATCH: how many compatible queued PRs one `mq.sh run` step checks and merges together (1 = one at a time, the default).
KOTONE_MQ_BATCH="${KOTONE_MQ_BATCH:-1}"
# KOTONE_MQ_REQUIRE_REVIEW: 1 = `mq.sh add` refuses a PR unless it has a comment exactly "reviewed <current head sha>" (a reviewer pass);
# 0 turns the gate off for this project (loud warning). `mq.sh run` re-verifies the recorded reviewed sha. The lead can waive one PR with env KOTONE_MQ_REVIEW_WAIVE=<pr>.
KOTONE_MQ_REQUIRE_REVIEW="${KOTONE_MQ_REQUIRE_REVIEW:-1}"
# KOTONE_MQ_DEPLOY_CHECK: the check the queue runs on origin/main before a production deploy. fast (default) = scripts/check.sh --fast, full = scripts/check.sh,
# none = skip it, allowed only while origin/main's tree equals the tree the queue just fully checked (otherwise the deploy is refused). Use none/full when --fast is diff-based.
# KOTONE_MQ_DEPLOY_ARG: first argument the queue passes to scripts/deploy.sh (default production).
# KOTONE_MQ_DEPLOY_CHECK="${KOTONE_MQ_DEPLOY_CHECK:-fast}"
# KOTONE_MQ_DEPLOY_ARG="${KOTONE_MQ_DEPLOY_ARG:-production}"
# KOTONE_MQ_REQUIRE_FAST_STAMP: 1 = `mq.sh add` refuses unless .git/kotone-ops/fast-ok-<PR head sha> exists (written by a clean-tree `check.sh --fast`). Default 0.
KOTONE_MQ_REQUIRE_FAST_STAMP="${KOTONE_MQ_REQUIRE_FAST_STAMP:-0}"
# Fix-up rule (off while both globs are empty): a follow-up commit after `reviewed <sha>` keeps the review when it only modifies files already in the
# reviewed diff that match these space-separated bash patterns (`*` also matches `/`), within the line cap. Example: tests/** and docs/** *.md.
KOTONE_MQ_FIXUP_TEST_GLOBS="${KOTONE_MQ_FIXUP_TEST_GLOBS:-}"
KOTONE_MQ_FIXUP_DOC_GLOBS="${KOTONE_MQ_FIXUP_DOC_GLOBS:-}"
KOTONE_MQ_FIXUP_MAX_LINES="${KOTONE_MQ_FIXUP_MAX_LINES:-40}"
# KOTONE_MQ_LOG: run log path (default <ops dir>/mq-log, i.e. .git/kotone-ops/mq-log).
# KOTONE_MQ_LOG="${KOTONE_MQ_LOG:-}"
